<!DOCTYPE html><html lang="fr"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><style rel="stylesheet" type="text/css">@charset "utf-8";

* { box-sizing: border-box; }

body { margin: 0px; color: rgb(25, 53, 72); background: rgb(245, 248, 251); font: 16px / 1.55 Inter, system-ui, sans-serif; }

header, main { max-width: 1120px; margin: auto; padding: 22px clamp(16px, 4vw, 48px); }

header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgb(204, 218, 228); }

.brand { font: bold 27px Georgia; }

.mark { background: rgb(23, 75, 65); color: rgb(255, 255, 255); padding: 5px 10px; border-radius: 7px; margin-right: 9px; }

select, input, textarea, button { font: inherit; }

select, input, textarea { width: 100%; padding: 10px; border: 1px solid rgb(137, 158, 174); border-radius: 6px; background: white; color: inherit; }

header select { width: auto; }

h1, h2, h3 { font-family: Georgia, serif; font-weight: 500; line-height: 1.12; }

h1 { font-size: clamp(35px, 6vw, 62px); margin: 10px 0px 20px; }

h2 { font-size: 28px; }

button { background: rgb(0, 111, 192); color: white; border: 0px; border-radius: 6px; padding: 10px 16px; cursor: pointer; }

.light { background: rgb(232, 242, 250); color: rgb(16, 75, 118); }

button:focus-visible, a:focus-visible { outline: rgb(0, 99, 168) solid 3px; }

small { color: rgb(69, 94, 112); }

.hero { margin: 20px 0px; background: rgb(229, 242, 252); padding: clamp(24px, 5vw, 54px); border-radius: 14px; border-left: 6px solid rgb(0, 111, 192); }

.stats, .grid, .row { display: flex; gap: 12px; flex-wrap: wrap; }

.stats article, .card { background: white; border: 1px solid rgb(203, 219, 230); border-radius: 10px; padding: 22px; }

.stats article { flex: 1 1 0%; min-width: 115px; }

.stats b { display: block; font: 32px Georgia; }

.card { margin: 14px 0px; }

.row { justify-content: space-between; align-items: center; }

.grid > label { flex: 1 1 0%; min-width: 170px; }

label { display: block; margin: 12px 0px; }

textarea { min-height: 220px; }

.quiet { color: rgb(69, 94, 112); }

.tag { font-size: 13px; background: rgb(225, 242, 231); padding: 4px 9px; border-radius: 4px; }

.sources img { max-height: 200px; max-width: 100%; }

figure { margin: 10px 0px; }

dialog { border: 0px; border-radius: 12px; width: min(520px, 95%); color: inherit; }

dialog::backdrop { background: rgba(18, 50, 76, 0.467); }

button + button { margin-left: 4px; }

.paper { background: white; color: black; border: 0.75mm solid black; padding: 4mm; font: 12pt Calibri, Arial; overflow-wrap: anywhere; }

.paper h3 { text-align: center; margin: 2px; text-transform: uppercase; font: bold 16pt "Times New Roman"; text-decoration: underline; }

.identity { display: flex; justify-content: space-between; gap: 8px; }

.question { white-space: pre-wrap; margin: 6px 0px; }

.sheet { background: white; display: flex; flex-direction: column; justify-content: space-around; gap: 3mm; width: 190mm; height: 277mm; padding: 1mm; }

.sheet .paper { flex: 0 0 auto; }

.sheetimg { max-width: 100%; display: block; }

.scroll { overflow: auto; }

.sheetwrap { width: max-content; }

.sheet + .sheet { margin-top: 12px; }

.actions { display: flex; flex-wrap: wrap; gap: 7px; }

#print { display: none; }

@media (max-width: 600px) {
  .card { padding: 15px; }
  header { padding: 13px; }
  .brand { font-size: 21px; }
  button { padding: 9px 12px; }
  .stats article { min-width: 80px; padding: 12px; }
  .stats small { font-size: 11px; }
}

@page { size: a4; margin: 10mm; }

@media print {
  body > :not(#print) { display: none !important; }
  #print { display: block; }
  .sheet { break-after: page; margin: 0px !important; }
  .sheet:last-child { break-after: auto; }
}

@media (min-width: 720px) {
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
}

.compare img { max-height: 420px; object-fit: contain; }

.brand { display: flex; align-items: center; gap: 8px; }

.brand img { object-fit: contain; }

.brand small { display: block; font: 12px system-ui; }

.schoolhead { display: block; width: 100%; height: auto; border-bottom: 1px solid rgb(17, 17, 17); margin-bottom: 2mm; }

@media screen {
  header { position: relative; background: white; }
  header::before { content: ""; position: absolute; inset: 0px 0px auto; height: 4px; background: linear-gradient(to right, rgb(0, 111, 192) 0px, rgb(0, 111, 192) 56%, rgb(139, 198, 76) 56%, rgb(139, 198, 76) 86%, rgb(255, 0, 0) 86%); }
  .brand { color: rgb(7, 92, 154); }
  .brand small { color: rgb(20, 96, 55); }
  .hero h1 { color: rgb(17, 68, 107); }
  .stats article { border-top: 3px solid rgb(0, 111, 192); }
  .stats article:nth-child(2) { border-top-color: rgb(255, 0, 0); }
  .stats article:nth-child(3) { border-top-color: rgb(139, 198, 76); }
  .stats b { color: rgb(7, 92, 154); }
  .stats article:nth-child(2) b { color: rgb(170, 29, 39); }
  .stats article:nth-child(3) b, .tag { color: rgb(22, 95, 53); }
  button:not(.light):hover { background: rgb(0, 91, 157); }
  .light:hover { background: rgb(215, 234, 248); }
  :focus-visible { outline: rgb(0, 99, 168) solid 3px; outline-offset: 2px; }
}

header { flex-wrap: wrap; gap: 10px; }

#accountActions button { font-size: 14px; }

.authform { max-width: 520px; }

#role:disabled { opacity: 1; color: rgb(25, 53, 72); }

.authform button { width: 100%; }

@media screen {
  .hero.scene { display: grid; grid-template-columns: minmax(0px, 1fr) clamp(170px, 34%, 340px); padding: 0px; overflow: hidden; background: rgb(229, 242, 252); align-items: stretch; }
  .scene-copy { align-self: center; padding: clamp(22px, 4vw, 48px); min-width: 0px; overflow-wrap: anywhere; }
  .scene::after { content: ""; display: block; min-height: 180px; background-position: 50% 40%; background-size: cover; background-repeat: no-repeat; }
  .scene h1 { margin-bottom: 10px; }
  .scene-copy button { margin-top: 10px; }
  @media (max-width: 600px) {
  .hero.scene { grid-template-columns: minmax(0px, 1fr) 30%; }
  .scene-copy { padding: 19px 12px; }
  .scene h1 { font-size: clamp(26px, 7vw, 36px); }
  .scene::after { min-height: 140px; }
  .scene small { font-size: 11px; }
}
  @media (prefers-reduced-motion: no-preference) {
  .ctp-reveal { animation: ctp-card-enter .55s cubic-bezier(.18,.74,.26,1) var(--delay,0ms) backwards; }
  @keyframes ctp-card-enter { 
  0% { opacity: 0; transform: translateY(18px) scale(0.985); }
  100% { opacity: 1; transform: none; }
}

/* CTP: real-size composition, scaled preview, independent print tree */
#print.composing{display:block!important;position:fixed!important;left:-12000px!important;top:0!important;width:190mm!important;visibility:hidden!important;pointer-events:none!important}
.sheet{width:190mm!important;height:277mm!important;min-width:190mm!important;max-width:190mm!important;box-sizing:border-box;gap:3mm;justify-content:space-around;overflow:hidden}
.sheet .paper{width:100%;min-width:0;position:relative;flex:0 0 auto}
.paper .question{white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;line-height:1.32;margin:2mm 0}
.paper .identity{flex-wrap:wrap;gap:1mm 4mm}
.paper .schoolhead{width:100%;height:auto;max-width:100%}
.preview-dialog{width:min(960px,calc(100vw - 16px))!important;max-width:calc(100vw - 16px);max-height:calc(100dvh - 24px);padding:12px;overflow:auto}
.preview-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:-12px;background:white;z-index:3;padding:8px 0;border-bottom:1px solid #dae4ed}
.preview-toolbar h2{font-size:23px;margin:0 0 4px}.preview-toolbar .actions{margin:0}
.preview-notice{font-size:13px;color:#764800}
.preview-viewport{width:100%;min-width:0;overflow:hidden;background:#e5ebf0;padding:8px 0;display:flex;align-items:center;flex-direction:column;gap:12px}
.preview-page{position:relative;overflow:hidden;flex:none;background:white;box-shadow:0 1px 5px #0002}
.preview-page>.sheet{position:absolute;left:0;top:0;transform-origin:top left;margin:0!important}
.frame-handle{position:absolute;right:0;top:0;background:#dcecf8;color:#16567b;font-size:20px;line-height:1;padding:8px;touch-action:none;cursor:ns-resize;border-radius:0}
@media print{#print{display:block!important;position:static!important;visibility:visible!important}.frame-handle{display:none!important}.sheet{transform:none!important;break-after:page;page-break-after:always}.sheet:last-child{break-after:auto;page-break-after:auto}}
.ai-feedback:not(:empty){margin:12px 0;padding:12px;border:1px solid #bdd8eb;background:#eef6fc;border-radius:8px;font-size:14px;overflow-wrap:anywhere}.ai-error:not(:empty){color:#9b2626;border-color:#efb6b6;background:#fff1f1}.ai-busy::before{content:'';display:inline-block;width:13px;height:13px;border:2px solid #aac9df;border-top-color:#006fc0;border-radius:50%;margin-right:8px;animation:ai-spin .8s linear infinite;vertical-align:-2px}@keyframes ai-spin{to{transform:rotate(360deg)}}button[data-ai]:disabled{opacity:.65;cursor:wait}@media(prefers-reduced-motion:reduce){.ai-busy::before{animation:none}}
/* CTP UI 2026 — responsive workspace */
@media screen{
:root{--ink:#152e45;--muted:#65758a;--line:#e0e8f0;--brand:#0969be;--soft:#edf5ff;--surface:#fff;--radius:18px}

@media screen{
.ctp-confirm{width:min(420px,calc(100vw - 32px));max-width:calc(100vw - 32px);padding:25px;border:1px solid #e1e8f0;border-radius:24px;background:#fff;color:#152e45;box-shadow:0 22px 85px #10263c40;overflow:visible}
.ctp-confirm::backdrop{background:#10263c85;backdrop-filter:blur(3px)}
.ctp-confirm h2{font-size:23px;margin:16px 0 8px;line-height:1.2}
.ctp-confirm p{font-size:14px;color:#607388;margin:0 0 24px;line-height:1.65}
.confirm-icon{width:51px;height:51px;background:#e7f1ff;color:#0969be;border-radius:16px;display:grid;place-items:center}
.confirm-icon svg{width:27px;height:27px}
.confirm-icon.danger{background:#fff0ee;color:#b63d37}
.confirm-actions{display:flex;justify-content:flex-end;gap:9px}
.confirm-actions button{flex:1;min-height:46px;white-space:normal}
.confirm-actions .danger-button{background:#b83b38;color:#fff}
.confirm-handle{display:none}
.ctp-notifications{position:fixed;right:18px;bottom:18px;max-width:calc(100vw - 32px);width:380px;display:grid;gap:8px;z-index:99999;pointer-events:none}
.ctp-toast{display:flex;align-items:flex-start;gap:11px;background:#fff;border:1px solid #f0d2d0;border-left:4px solid #c85a55;box-shadow:0 10px 35px #152e451c;border-radius:14px;padding:14px;pointer-events:auto}
.ctp-toast.success{border-color:#cee9dc;border-left-color:#23935d}
.toast-icon{background:#fceeed;color:#a73c37;border-radius:9px;padding:7px;display:grid;place-items:center}
.success .toast-icon{background:#e7f6ed;color:#20844f}
.ctp-toast>div{flex:1;min-width:0}
.ctp-toast strong{font-size:13px;color:#152e45}
.ctp-toast p{margin:3px 0 0;font-size:12px;color:#607388;overflow-wrap:anywhere}
.ctp-toast button{background:transparent!important;color:#6b7a8a;min-height:30px;padding:0 5px;font-size:22px;line-height:1}
@media(max-width:520px){.ctp-confirm{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;width:100%;max-width:100%;padding:13px 20px max(24px,env(safe-area-inset-bottom));border-radius:25px 25px 0 0;animation:ctp-sheet-in .2s ease-out}.confirm-handle{display:block;margin:0 auto 20px;width:38px;height:4px;background:#d6e0eb;border-radius:99px}.confirm-actions button{font-size:13px}.ctp-notifications{left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));width:auto;max-width:none}}
@keyframes ctp-sheet-in{from{transform:translateY(100%)}to{transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.ctp-confirm{animation:none!important}}
}

/* PDF A4 direct, sans boîte d'impression. Le contour est identique au rendu. */
.paper{border:0.75mm solid #000}
.pdf-capture-stage{position:fixed;left:0;top:0;width:190mm;pointer-events:none;z-index:-1000;background:white;color:black}
.pdf-capture-stage .sheet{position:relative!important;transform:none!important;margin:0!important;visibility:visible!important}
.pdf-export-status[hidden]{display:none!important}
.pdf-export-status{margin:10px 0 12px;padding:12px 14px;background:#edf5fd;border:1px solid #d3e4f3;border-radius:12px;font-size:12px;color:#175786}
.pdf-export-caption{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pdf-export-caption strong{white-space:nowrap;font-variant-numeric:tabular-nums}
.pdf-export-track{margin-top:8px;height:6px;border-radius:20px;background:#d4e4f1;overflow:hidden}
.pdf-export-track>span{display:block;height:100%;background:#0969be;border-radius:20px;transition:width .2s}
.pdf-error{background:#fff1f0;border-color:#edc7c4;color:#962f29}
.pdf-download-again{display:inline-block;margin-top:9px;color:#075fa9;font-weight:700;text-underline-offset:2px}

@media screen{

.workspace-switch button:hover{background:#f8fbff!important}
.incubator-hero{display:flex;align-items:center;gap:20px;position:relative;overflow:hidden;border:1px solid #d8e6f6;background:linear-gradient(125deg,#e7f1ff,#fff 84%);border-radius:22px;padding:27px;margin-bottom:24px}

.incubator-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:12px}
.incubator-card,.incubator-empty{background:white;border:1px solid #e0e8f0;border-radius:18px;padding:17px;box-shadow:0 3px 12px #193c5c08}
.incubator-card-top{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:14px}.incubator-card h3{font-size:19px;overflow-wrap:anywhere}.incubator-card p{font-size:13px;color:#65758a;margin:4px 0;overflow-wrap:anywhere}.incubator-card>small{display:block;margin-bottom:12px;font-size:11px}.incubator-card button{width:100%;display:flex;align-items:center;justify-content:space-between}.incubator-empty{grid-column:1/-1;text-align:center;padding:27px 16px;color:#607388}.incubator-empty p{max-width:400px;margin:8px auto;font-size:13px}

@media(max-width:520px){.incubator-hero{padding:20px 16px;gap:6px}.incubator-hero h1{font-size:29px}.incubator-hero p{font-size:13px}.incubator-art{width:52px;height:52px;border-radius:16px;align-self:flex-start}.incubator-art svg{width:31px;height:31px}.workspace-switch button{font-size:11px;gap:5px}.workspace-switch .ui-icon{width:16px;height:16px}}

<script>
const app=document.querySelector('#app'),dlg=document.querySelector('#dlg'),roles=document.querySelector('#role'),out=document.querySelector('#print');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db, data={sessions:[],subjects:[]}, sid='',qid='',tab='document';
const endpoint='https://dildofnstrdomeiqjboe.supabase.co/functions/v1/ctp-api';
let people=[],currentId='',baseline={},timer,queue=Promise.resolve(),refreshing,staffPage=false,incubatorPage=false,registering=false;
const accounts=()=>people,uid=()=>currentId,me=()=>people.find(a=>a.id===uid());
const profiles=a=>a?['Enseignant',...(a.director?['Directeur']:a.delegate?['Divisionnaire']:[])]:[];
const isDirector=()=>me()?.director&&roles.value==='Directeur',manage=()=>profiles(me()).includes(roles.value)&&roles.value!=='Enseignant',canExportPDF=()=>Boolean(manage()),owns=q=>q.owner===uid(),visible=q=>{const s=data.sessions.find(s=>s.id===q.sid);return Boolean(s&&(s.incubator?manage()&&owns(q)&&s.created_by===uid():owns(q)||(manage()&&q.status!=='Brouillon')))};
let credentials=JSON.parse(sessionStorage.getItem('ctp-cloud-session')||'null');
function keep(t){credentials=t;if(t)sessionStorage.setItem('ctp-cloud-session',JSON.stringify(t));else sessionStorage.removeItem('ctp-cloud-session')}
async function call(action,payload={},retry=true){
 let r;try{r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json',...(credentials?{Authorization:'Bearer '+credentials.access_token}:{})},body:JSON.stringify({action,...payload})})}catch{throw Error('Connexion réseau indisponible. Vos modifications restent ouvertes.')}
 if(r.status===401&&retry&&credentials&&action!=='refresh'){refreshing??=call('refresh',{refresh_token:credentials.refresh_token},false).then(keep).finally(()=>refreshing=null);await refreshing;return call(action,payload,false)}
 let result;try{result=await r.json()}catch{throw Error('Le serveur a renvoyé une réponse invalide. Réessayez.')}if(!r.ok)throw Error(result.error||'Connexion au serveur impossible.');return result
}
function clean(q){const {versions,_rev,...d}=q;return d}
function resetView(){sid='';qid='';tab='document';staffPage=false;incubatorPage=false;if(dlg.open)dlg.close();out.innerHTML=''}
let changeSerial=0;
async function sync(){const serial=changeSerial;const state=await call('state');if(serial!==changeSerial||hasUnsaved())return;people=state.accounts;currentId=state.uid;data={sessions:state.sessions,subjects:state.subjects};baseline={};for(const s of data.sessions)baseline[s.id]=true;for(const q of data.subjects)baseline[q.id]=JSON.stringify(clean(q));render()}
async function flush(){
 for(const s of data.sessions){if(!baseline[s.id]){await call('session',s);baseline[s.id]=true}}
 for(const q of data.subjects){const doc=clean(q),encoded=JSON.stringify(doc);if(baseline[q.id]===encoded)continue;await commitSubject(q,encoded)}
}
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function mergeDraft(previous,local,remote){
 const merged={...remote},conflicts=[];
 for(const key of Object.keys(local)){
  if(same(local[key],previous[key]))continue;
  if(!same(remote[key],previous[key])&&!same(local[key],remote[key]))conflicts.push(key);
  merged[key]=local[key]
 }
 return {merged,conflicts}
}
function resolveDraft(keys,local,remote){
 const dialog=document.createElement('dialog');
 const labels={body:'Questions',branch:'Branche',classe:'Classe',images:'Photos sources',figures:'Schémas',teacher:'Titulaire',status:'Statut'};
 function sample(v){return Array.isArray(v)?v.length+' élément(s)':typeof v==='object'?'Données modifiées':String(v??'')}
 dialog.innerHTML='<h2>Deux modifications sur la même fiche</h2><p>Choisissez la version à garder pour chaque élément.</p>'+keys.map((k,i)=>'<label>'+esc(labels[k]||k)+'<select data-index="'+i+'"><option value="local">Ma modification</option><option value="remote">Version enregistrée</option></select></label><details><summary>Comparer les versions</summary><p>Ma modification : '+esc(sample(local[k]))+'</p><p>Version enregistrée : '+esc(sample(remote[k]))+'</p></details>').join('')+'<button>Appliquer et enregistrer</button>';

async function commitSubject(q,encoded){
 for(let attempt=0;attempt<3;attempt++){
  try{const result=await call('subject',{doc:JSON.parse(encoded),revision:q._rev||0});q._rev=result.revision;baseline[q.id]=encoded;return}
  catch(e){
   if(!/version modifiée|duplicate key|identifiant ou place déjà utilisé/i.test(e.message))throw e;
   const state=await call('state'),saved=state.subjects.find(item=>item.id===q.id);if(!saved)throw e;
   const remote=clean(saved),local=clean(q),old=JSON.parse(baseline[q.id]||'{}');
   const {merged,conflicts}=mergeDraft(old,local,remote);
   if(conflicts.length){for(const k of await resolveDraft(conflicts,local,remote))merged[k]=remote[k]}
   Object.assign(q,merged,{_rev:saved._rev,versions:saved.versions});baseline[q.id]=JSON.stringify(remote);
   if(q.id===qid)render();
   if(Object.keys(merged).every(k=>same(merged[k],remote[k])))return;
   encoded=JSON.stringify(clean(q))
  }
 }
 throw Error('La fiche change sur un autre appareil. Vos modifications restent ouvertes.')
}

async function assist(mode){
 const q=subject();if(!q||activeAI.has(q.id))return;
 const original=q.body,sourceSnapshot=JSON.stringify(q.images);if(mode==='analyse'&&!original.trim())return;
 if(mode==='transcribe'&&!q.images.length)return;
 activeAI.add(q.id);const msg=document.querySelector('#cloudStatus');const started=Date.now();const label=mode==='transcribe'?'Transcription':'Analyse';showAI(q,label+' en cours…',true);const ticker=setInterval(()=>{if(activeAI.has(q.id))showAI(q,label+' en cours · '+Math.floor((Date.now()-started)/1000)+' s. '+(Date.now()-started>22000?'Recherche d’un modèle disponible…':'Traitement par Gemini…'),true)},1000);
 try{
  await pending();
  const r=await call('assist',{id:q.id,mode});
  if(subject()?.id!==q.id||q.body!==original||JSON.stringify(q.images)!==sourceSnapshot)throw Error('Le questionnaire ou les photos ont changé. Relancez la demande.');
  if(mode==='transcribe'){
   if(typeof r.text!=='string'||!r.text.trim())throw Error('Aucun texte lisible détecté. Les photos sources sont conservées.');
   if(original&&!await askConfirm({title:'Remplacer le questionnaire ?',message:'La transcription remplacera le texte actuel. Les photos sources seront conservées.',label:'Remplacer le texte'}))return;
   const figures=[];let skipped=0;
   for(const spec of r.figures||[]){
    if(!q.images[spec.page-1]){skipped++;continue}
    try{figures.push(await makeFigure(spec,q.images,q.id))}catch{skipped++}
   }
   if(subject()?.id!==q.id||q.body!==original||JSON.stringify(q.images)!==sourceSnapshot)throw Error('Le questionnaire a changé pendant le traitement.');
   q.body=r.text;q.figures=[...q.figures,...figures.filter(f=>!q.figures.some(g=>g.src===f.src))];delete q.analysis;tab='document';
   save();render();await pending();showAI(q,skipped?'Texte enregistré. '+skipped+' schéma(s) à vérifier dans les photos sources.':'Transcription enregistrée.');
  }else{q.analysis=r;save();render();await pending();showAI(q,'Analyse terminée et enregistrée.')}
 }catch(e){showAI(q,e.message||'Analyse interrompue. Réessayez.',false,true)}finally{clearInterval(ticker);activeAI.delete(q.id);const f=aiFeedback.get(q.id);if(f?.busy)showAI(q,'Traitement interrompu.',false);else if(f)showAI(q,f.message,false,f.error)}
}

async function makeFigure(spec,photos,subjectId){
 const im=new Image();im.src=photos[spec.page-1];await im.decode();const box=spec.box;
 if(!Array.isArray(box)||box.length!==4||!box.every(Number.isFinite))throw Error('Zone du schéma invalide.');
 const [y,x,b,r]=box.map(v=>Math.max(0,Math.min(1000,v))/1000);
 if(b<=y||r<=x)throw Error('Zone du schéma vide.');
 const w=Math.max(1,Math.round(im.width*(r-x))),h=Math.max(1,Math.round(im.height*(b-y)));
 const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const c=canvas.getContext('2d');c.drawImage(im,im.width*x,im.height*y,w,h,0,0,w,h);
 const original=canvas.toDataURL('image/png'),fallback={src:original,width:50,align:'centre'};
 if(!spec.shapes?.length)return fallback;
 c.fillStyle='white';c.fillRect(0,0,w,h);c.strokeStyle='#171717';c.fillStyle='#171717';c.lineWidth=Math.max(1,w/440);
 try{for(const s of spec.shapes.slice(0,400)){const X=v=>Number(v)*w/1000,Y=v=>Number(v)*h/1000;c.beginPath();if(s.type==='line'){c.moveTo(X(s.x),Y(s.y));c.lineTo(X(s.x2),Y(s.y2));c.stroke()}else if(s.type==='circle'){c.arc(X(s.x),Y(s.y),Math.abs(X(s.r)),0,2*Math.PI);c.stroke()}else if(s.type==='text'){c.font=Math.max(8,Y(s.size||70))+'px sans-serif';c.fillText(String(s.text||''),X(s.x),Y(s.y))}else return fallback}
 const src=canvas.toDataURL('image/png');const verdict=await call('verifyFigure',{id:subjectId,original,rendered:src});return verdict.match===true?{...fallback,src}:fallback}catch{return fallback}
}

let confirmQueue=Promise.resolve(),statusChanging=false;
function askConfirm({title,message,label='Confirmer',danger=false}){
 const task=()=>new Promise(resolve=>{
  const previous=document.activeElement;
  const modal=document.createElement('dialog');modal.className='ctp-confirm';
  const ident='confirm-'+crypto.randomUUID();
  modal.setAttribute('aria-labelledby',ident);modal.setAttribute('aria-describedby',ident+'-desc');
  modal.innerHTML='<div class="confirm-handle"></div><div class="confirm-icon '+(danger?'danger':'')+'">'+glyph(danger?'file':'check')+'</div><h2 id="'+ident+'">'+esc(title)+'</h2><p id="'+ident+'-desc">'+esc(message)+'</p><div class="confirm-actions"><button type="button" class="light" data-cancel>Annuler</button><button type="button" class="'+(danger?'danger-button':'')+'" data-ok>'+esc(label)+'</button></div>';
  let accepted=false;
  modal.querySelector('[data-ok]').onclick=()=>{accepted=true;modal.close()};
  modal.querySelector('[data-cancel]').onclick=()=>modal.close();
  modal.oncancel=e=>{e.preventDefault();modal.close()};
  modal.addEventListener('click',e=>{if(e.target!==modal)return;const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()});
  modal.addEventListener('close',()=>{modal.remove();if(previous?.isConnected)previous.focus({preventScroll:true});resolve(accepted)},{once:true});
  document.body.append(modal);modal.showModal();modal.querySelector('[data-cancel]').focus({preventScroll:true});
 });
 const result=confirmQueue.then(task,task);confirmQueue=result.catch(()=>{});return result;
}

 const item=document.createElement('div');item.className='ctp-toast '+kind;item.setAttribute('role',kind==='error'?'alert':'status');
 item.innerHTML='<span class="toast-icon">'+glyph(kind==='error'?'file':'check')+'</span><div><strong>'+ (kind==='error'?'Une action nécessite votre attention':'Opération réussie')+'</strong><p>'+esc(message)+'</p></div><button type="button" aria-label="Fermer la notification">×</button>';

async function statusTo(s){
 if(!manage()||statusChanging||s!=='Validé')return;const q=subject();if(!q)return;const before=q.status;statusChanging=true;
 try{
  if(!await askConfirm({title:'Valider le questionnaire',message:'Ce questionnaire sera marqué comme validé et prêt pour l’export PDF.',label:'Valider'}))return;
  if(subject()?.id!==q.id||q.status!==before)return;
  await pending();q.status=s;await pending();await sync();notify('Questionnaire validé.','success');
 }catch(e){if(q.status===s)q.status=before;render();notify(e.message)}finally{statusChanging=false}
}

async function send(){

 try{await pending();q.status='Envoyé';await pending();await sync();document.querySelector('#cloudStatus').textContent='Questionnaire envoyé à la direction.'}
 catch(e){if(q.status==='Envoyé')q.status=before;document.querySelector('#cloudStatus').textContent='Envoi à vérifier · '+e.message;render()}
}

async function upload(el,figure){
 const q=subject(),files=[...el.files],msg=document.querySelector('#cloudStatus');if(!q)return;
 const allowed=/^image\/(png|jpe?g|webp|gif|avif)$/i,errors=[];
 for(const file of files){
  try{
   if(!allowed.test(file.type))throw Error('Format non pris en charge : PNG, JPEG, WebP, GIF ou AVIF.');
   if(file.size>15*1024*1024)throw Error('Image trop volumineuse (15 Mo maximum).');
   let src=await new Promise((ok,fail)=>{const reader=new FileReader();reader.onload=()=>ok(reader.result);reader.onerror=fail;reader.readAsDataURL(file)});
   if(file.size>1.5*1024*1024){const im=new Image();im.src=src;await im.decode();const scale=Math.min(1,2400/Math.max(im.width,im.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(im.width*scale));canvas.height=Math.max(1,Math.round(im.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,canvas.width,canvas.height);src=canvas.toDataURL('image/jpeg',.88)}
   if(subject()?.id!==q.id)throw Error('La fiche a changé pendant l’import.');
   if(figure)q.figures.push({src,width:45,align:'centre'});else if(!q.images.includes(src))q.images.push(src);
  }catch(e){errors.push(file.name+' : '+(e.message||'import impossible'))}
 }
 save();render();try{await pending();if(errors.length)msg.textContent=errors.join(' · ');if(!figure&&!q.body.trim()&&q.images.length&&!errors.length)await assist('transcribe')}catch(e){msg.textContent=e.message}
}

  if(doc.body.trim()&&!out.querySelector('.question')?.textContent.trim())throw Error('Composition incomplète : les questions ne sont pas visibles.');
  const original=out.innerHTML;out.className='';
  dlg.classList.add('preview-dialog');dlg.innerHTML='<div class="preview-toolbar"><div><h2>Aperçu A4</h2><small>'+sheets.length+' feuille(s) · '+(sheets.length===1?sheet.children.length+' exemplaire(s)':'1 questionnaire')+'</small></div><div class="actions">'+(canExportPDF()?'<button id="exportPdfNow" type="button">Enregistrer en PDF</button>':'')+'<button class="light" type="button" onclick="dlg.close()">Fermer</button></div></div>'+(notice?'<p class="preview-notice">'+esc(notice)+'</p>':'')+'<div id="pdfExportStatus" class="pdf-export-status" role="status" aria-live="polite" hidden></div><div class="preview-viewport"></div>';
  const viewport=dlg.querySelector('.preview-viewport');for(const sh of sheets){const wrap=document.createElement('div');wrap.className='preview-page';wrap.append(sh.cloneNode(true));viewport.append(wrap)}
  dlg.showModal();
  const resize=()=>{for(const wrap of viewport.children){const sh=wrap.firstElementChild,scale=Math.min(1,(viewport.clientWidth-4)/sh.offsetWidth);wrap.style.width=sh.offsetWidth*scale+'px';wrap.style.height=sh.offsetHeight*scale+'px';sh.style.transform='scale('+scale+')';wrap.dataset.scale=scale}};
  resize();previewResize?.disconnect();previewResize=new ResizeObserver(resize);previewResize.observe(viewport);
  enableFramePlacement(q);
  const exportBtn=dlg.querySelector('#exportPdfNow');if(exportBtn)exportBtn.onclick=()=>exportQuestionnairePdf(doc,s,viewport,exportBtn);
  msg.textContent='Aperçu prêt.';
 }catch(e){out.innerHTML='';out.className='';msg.textContent='Aperçu impossible · '+e.message;notify(e.message)}
 finally{previewBusy=false}
}

let pdfExportBusy=false,pdfLibraries=null;
function loadPdfLibrary(url,ready){
 if(ready())return Promise.resolve();
 return new Promise((resolve,reject)=>{
  const script=document.createElement('script');script.src=url;script.async=true;
  const timeout=setTimeout(()=>{script.remove();reject(Error('Le chargement du moteur PDF a expiré. Réessayez.'))},20000);
  script.onload=()=>{clearTimeout(timeout);if(ready())resolve();else{script.remove();reject(Error('Le moteur PDF n’a pas démarré.'))}};
  script.onerror=()=>{clearTimeout(timeout);script.remove();reject(Error('Impossible de charger le moteur PDF. Vérifiez la connexion.'))};
  document.head.append(script)
 })
}
function loadPdfLibraries(){
 if(!pdfLibraries)pdfLibraries=Promise.all([
  loadPdfLibrary('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',()=>typeof window.html2canvas==='function'),
  loadPdfLibrary('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>typeof window.jspdf?.jsPDF==='function')
 ]).catch(e=>{pdfLibraries=null;throw e});
 return pdfLibraries
}
function pdfFileName(doc,s){
 const safe=v=>String(v||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60);
 return ['CTP',safe(doc.branch),safe(doc.classe),safe(s.name)].filter(Boolean).join('-')+'.pdf'
}
function pdfExportFeedback(node,pct,message,error=false){
 if(!node)return;node.hidden=false;node.className='pdf-export-status'+(error?' pdf-error':'');
 node.innerHTML='<div class="pdf-export-caption"><span>'+esc(message)+'</span><strong>'+Math.round(pct)+' %</strong></div><div class="pdf-export-track" role="progressbar" aria-label="Création du PDF" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(pct)+'"><span style="width:'+pct+'%"></span></div>';
}
async function exportQuestionnairePdf(doc,s,viewport,button){
 if(!canExportPDF()||pdfExportBusy)return;
 const pages=[...viewport.querySelectorAll('.sheet')];
 if(!pages.length)return notify('Aucune page à exporter.');
 pdfExportBusy=true;button.disabled=true;button.textContent='Création du PDF…';
 const status=dlg.querySelector('#pdfExportStatus'),close=dlg.querySelector('.preview-close')||[...dlg.querySelectorAll('.preview-toolbar button')].find(b=>b!==button);
 if(close)close.disabled=true;
 const cancel=dlg.oncancel;dlg.oncancel=e=>e.preventDefault();
 const stage=document.createElement('div');stage.className='pdf-capture-stage';document.body.append(stage);
 try{
  pdfExportFeedback(status,5,'Préparation du PDF A4…');
  await loadPdfLibraries();
  if(document.fonts?.ready)await Promise.race([document.fonts.ready,new Promise(resolve=>setTimeout(resolve,2500))]);
  const pdf=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
  pdf.setProperties({title:doc.branch+' — '+doc.classe,subject:s.name,author:'Collège Terre Promise',creator:'CTP Épreuves'});
  for(let i=0;i<pages.length;i++){
   pdfExportFeedback(status,15+75*i/pages.length,'Rendu haute définition · page '+(i+1)+'/'+pages.length);
   const page=pages[i].cloneNode(true);page.style.transform='none';page.style.margin='0';page.querySelectorAll('.frame-handle').forEach(el=>el.remove());
   stage.replaceChildren(page);
   await Promise.all([...page.querySelectorAll('img')].map(img=>img.decode()));
   await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
   const canvas=await window.html2canvas(page,{scale:2.5,useCORS:true,allowTaint:false,backgroundColor:'#ffffff',logging:false,scrollX:0,scrollY:0});
   if(!canvas.width||!canvas.height)throw Error('La page '+(i+1)+' n’a pas pu être rendue.');
   if(i)pdf.addPage('a4','portrait');
   pdf.addImage(canvas,'PNG',10,10,190,277,undefined,'FAST');
   canvas.width=0;canvas.height=0;
   pdfExportFeedback(status,15+75*(i+1)/pages.length,'Page '+(i+1)+'/'+pages.length+' ajoutée');
  }
  pdfExportFeedback(status,95,'Préparation du téléchargement…');
  const blob=pdf.output('blob');if(!blob||blob.size<100)throw Error('Le fichier PDF généré est invalide.');
  const name=pdfFileName(doc,s),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;link.rel='noopener';link.style.display='none';document.body.append(link);link.click();link.remove();
  pdfExportFeedback(status,100,'PDF créé · téléchargement lancé. Vous pouvez le générer à nouveau.');
  const retry=document.createElement('a');retry.href=url;retry.download=name;retry.rel='noopener';retry.className='pdf-download-again';retry.textContent='Télécharger de nouveau';status.append(retry);
  setTimeout(()=>{URL.revokeObjectURL(url);retry.remove()},120000);
 }catch(e){pdfExportFeedback(status,0,e.message||'Échec de la création du PDF. Réessayez.',true)}
 finally{stage.remove();pdfExportBusy=false;button.disabled=false;button.textContent=status?.classList.contains('pdf-error')?'Réessayer l’enregistrement':'Enregistrer de nouveau en PDF';if(close)close.disabled=false;dlg.oncancel=cancel}
}

function enableFramePlacement(q){
 const frames=[...dlg.querySelectorAll('.paper')],shifts=q.offsets||{};
 frames.forEach((el,i)=>{
  const page=el.parentElement,wrap=page.parentElement;
  const scale=()=>Number(wrap.dataset.scale)||1;
  const move=y=>{el.dataset.y=y;el.style.transform='translateY('+y+'px)'};
  const apply=y=>{const f=scale(),p=page.getBoundingClientRect(),r=el.getBoundingClientRect(),current=Number(el.dataset.y||0);
   const lo=((el.previousElementSibling?el.previousElementSibling.getBoundingClientRect().bottom+10*f:p.top+4*f)-r.top)/f+current;
   const hi=((el.nextElementSibling?el.nextElementSibling.getBoundingClientRect().top-10*f:p.bottom-4*f)-r.bottom)/f+current;
   move(lo<=hi?Math.max(lo,Math.min(hi,y)):0)};
  apply(Number(shifts[i])||0);
  if(!canExportPDF()||q!==subject()||q.status==='Imprimé')return;
  const handle=document.createElement('button');handle.type='button';handle.className='frame-handle';handle.textContent='↕';handle.title='Déplacer le cadre';handle.setAttribute('aria-label','Déplacer le cadre verticalement');el.append(handle);
  handle.onpointerdown=e=>{e.preventDefault();const start=e.clientY,base=Number(el.dataset.y)||0;handle.setPointerCapture(e.pointerId);
   handle.onpointermove=m=>apply(base+(m.clientY-start)/scale());handle.onpointerup=()=>{handle.onpointermove=null;q.offsets={...q.offsets,[i]:Number(el.dataset.y)};save()}};
 });
}
dlg.onclose=()=>{dlg.style.width='';dlg.classList.remove('preview-dialog');previewResize?.disconnect()};
const revealedCards=new Set();
const observer=new IntersectionObserver(entries=>{
 let position=0;
 for(const entry of entries){if(!entry.isIntersecting)continue;
  observer.unobserve(entry.target);
  const key=entry.target.dataset.revealKey;if(revealedCards.has(key))continue;
  revealedCards.add(key);entry.target.style.setProperty('--delay',Math.min(position++,3)*65+'ms');entry.target.classList.add('ctp-reveal');
 }
},{threshold:0});
const watchCards=new MutationObserver(()=>{
 const page=[uid(),roles.value,registering,staffPage,sid,qid,tab].join('/');
 app.querySelectorAll('.hero,.stats article,.card').forEach((el,i)=>{
  const key=page+'/'+i;if(el.dataset.revealKey===key)return;
  el.dataset.revealKey=key;if(!revealedCards.has(key))observer.observe(el)
 })
});
watchCards.observe(app,{childList:true,subtree:true});
reloadCloud();
</script>
